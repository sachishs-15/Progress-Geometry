DATA:
  DATA_NAME: 'GoalStep'
  DATA_INFO: 'data/goalstep/data_info.json'
INPUT:
  MODALITY: 'visual'
  VISUAL_FEATURE: 'dinov2_noreg_tokens'
  MOTION_FEATURE: 'motion_dummy'
MODEL:
  MODEL_NAME: 'LSTR'
  FEATURE_HEAD:
    LINEAR_ENABLED: True
    LINEAR_OUT_FEATURES: 1024
  LSTR:
    NUM_HEADS: 16
    DIM_FEEDFORWARD: 1024
    DROPOUT: 0.2
    ACTIVATION: 'relu'
    LONG_MEMORY_SECONDS: 0
    LONG_MEMORY_SAMPLE_RATE: 4
    WORK_MEMORY_SECONDS: 8
    WORK_MEMORY_SAMPLE_RATE: 1
    ENC_MODULE: [
      [16, 1, True], [32, 2, True]
    ]
    DEC_MODULE: [-1, 2, True]
  CRITERIONS: [['MCE', {}]]
  TOKEN_HEAD:
    MODE: 'avg'
    GRID: 2
DATA_LOADER:
  BATCH_SIZE: 16
  NUM_WORKERS: 8
  PIN_MEMORY: True
SOLVER:
  NUM_EPOCHS: 4
  OPTIMIZER: 'adam'
  BASE_LR: 2e-04
  WEIGHT_DECAY: 5e-05
  SCHEDULER:
    SCHEDULER_NAME: 'warmup_cosine'
    WARMUP_FACTOR: 0.3
    WARMUP_EPOCHS: 1.6
    WARMUP_METHOD: 'linear'
