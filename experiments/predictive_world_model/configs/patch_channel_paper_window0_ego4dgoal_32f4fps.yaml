# Companion to patch_channel_paper_window0_vicreg_ego4dgoal_32f4fps.yaml -- IDENTICAL
# except checkpoint_dir and the two vicreg_*_weight values (0 here: stop-grad-only, the
# "none" leg of the {none,vicreg} x {cls,patch} ego4dgoal comparison at 32 frames/4fps).
# Deliberately points at the SAME live_cache_dir/sample_fps/patch_hub_id/patch_img_size as
# the vicreg config so this run reuses that run's already-extracted dense cache (17k+
# clips) instead of re-decoding every video from scratch.

train_manifest: /home/sachish/proc-planning/data/ego4dgoal/ego4dgoal_train.csv
path_col: video_path
live_cache_dir: /mnt/rdata7/proprogress/data/ego4dgoal/live_cache/pwm_dense_4fps
checkpoint_dir: checkpoints/pwm_patch_channel_paper_window0_ego4dgoal_32f4fps
val_fraction: 0.0
seed: 0

feature_dim: 384
latent_dim: 384        # unused by projector_type=channel -- actual dim is channel_out_dim
channel_out_dim: 8
channel_hidden: 192
num_patches: 196
token_mode: patch
projector_type: channel
patch_hub_id: dinov2_vits14
patch_img_size: 196    # reference derivation (visual_world_model.py __init__): decoder_scale=16,
                       # num_side_patches = image_size(224)//16 = 14, encoder_image_size =
                       # 14 * patch_size(14) = 196 -- i.e. it resizes to 196px specifically
                       # to force a 14x14 grid, independent of the env's raw 224px images
n_frames: 32
sample_fps: 4            # 32 frames at 4 fps = a random 8s of each leaf clip per epoch, from a dense per-clip live cache
short_clip_policy: drop   # clips under (n_frames-1)/sample_fps = 7.75s are dropped (38% of train clips)
windows_per_clip: 1

depth: 6
heads: 16
dim_head: 64
mlp_dim: 2048
dropout: 0.1
emb_dropout: 0.0

agg_mlp_hidden_dim: 512
agg_out_dim: 128

window_size: 0

pred_loss: l2
pred_weight: 1.0
straighten_weight: 0.1
vicreg_std_weight: 0.0
vicreg_cov_weight: 0.0
vicreg_granularity: token
sigreg_weight: 0.0
chord_weight: 0.0
stop_grad: true

encoder_lr: 1e-5
predictor_lr: 5e-4
weight_decay: 0.0
grad_clip: 0.0

epochs: 50
save_every: 10
batch_size: 8
amp: true
num_workers: 7  # per GPU rank: live-cache decode is the bottleneck (3.5s/clip, GPU forward 0.06s)
