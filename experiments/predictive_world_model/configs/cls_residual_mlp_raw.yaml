# token_mode="raw" counterpart to cls_residual_mlp_paper_window0.yaml -- same recipe
# (residual_mlp encoder, straighten_weight=0.1, l2 pred loss, stop_grad, K400 10%,
# epochs/batch_size/amp/encoder_lr/predictor_lr all unchanged) but with the frozen
# DINOv2 CLS features replaced by a trainable CNN (models/pixel_encoder.py's
# SmallResnetPixelEncoder) run directly on raw RGB frames -- see world_model.py's
# token_mode="raw" docstring. Everything downstream of that CNN (ResidualMlpEncoder,
# CausalPredictor, WorldModelLoss) is untouched.
#
# NOT matched, and cannot be:
#   features -- no raw-pixel bulk-precompute format exists (train.py refuses --features
#     with --token-mode raw). train_manifest points at the SAME 24,126-clip (10% of
#     241,258) K400 split cls_residual_mlp_paper_window0.yaml's precomputed .pt was built
#     from, so the two runs still train on identical videos -- just features-from-a-file
#     vs. decode-and-encode-from-scratch.
#   encoder_lr -- left at 1e-5 (the paper config's own value, tuned for a projector
#     correcting an already-good frozen feature) for an apples-to-apples "only the input
#     representation changed" comparison. A CNN trained from scratch typically wants a
#     higher LR than that; if this run's encoder loss looks stuck, that's the first knob
#     to revisit, separately from this comparison.

train_manifest: /home/sachish/proc-planning/data/kinetics-400/k400_train_10pct.csv
checkpoint_dir: checkpoints/pwm_raw_residual_mlp_paper_window0
val_fraction: 0.0
seed: 0

feature_dim: 384
latent_dim: 384
norm_type: layernorm
encoder_type: residual_mlp
encoder_depth: 2
encoder_expansion: 4
encoder_dropout: 0.0
token_mode: raw
pixel_encoder_type: small_resnet
raw_img_size: 224
n_frames: 16
max_len: 16

nhead: 8
pred_num_layers: 2
dropout: 0.1

window_size: 0

pred_loss: l2
pred_weight: 1.0
straighten_weight: 0.1
vicreg_std_weight: 0.0
vicreg_cov_weight: 0.0
sigreg_weight: 0.0
chord_weight: 0.0
stop_grad: true

encoder_lr: 1e-5
predictor_lr: 5e-4
weight_decay: 0.0
grad_clip: 0.0

epochs: 50
save_every: 10
batch_size: 32
amp: true
num_workers: 4
progress_every: 200
