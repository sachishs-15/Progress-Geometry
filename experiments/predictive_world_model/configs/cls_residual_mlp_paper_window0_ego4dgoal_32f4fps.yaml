# Companion to cls_residual_mlp_paper_window0_vicreg_ego4dgoal_32f4fps.yaml -- IDENTICAL
# except checkpoint_dir and the two vicreg_*_weight values (0 here: stop-grad-only, the
# "none" leg of the {none,vicreg} x {cls,patch} ego4dgoal comparison at 32 frames/4fps).
# Shares the same live_cache_dir/sample_fps -- see that file's header for why cls and
# patch dense-cache entries can't collide even sharing one directory.

train_manifest: /home/sachish/proc-planning/data/ego4dgoal/ego4dgoal_train.csv
path_col: video_path
live_cache_dir: /mnt/rdata7/proprogress/data/ego4dgoal/live_cache/pwm_dense_4fps
checkpoint_dir: checkpoints/pwm_cls_residual_mlp_paper_window0_ego4dgoal_32f4fps
val_fraction: 0.0
seed: 0

feature_dim: 384
latent_dim: 384
norm_type: layernorm
encoder_type: residual_mlp
encoder_depth: 2
encoder_expansion: 4
encoder_dropout: 0.0
token_mode: cls
n_frames: 32
max_len: 32
sample_fps: 4
short_clip_policy: drop
windows_per_clip: 1

nhead: 8
pred_num_layers: 2
dropout: 0.1

window_size: 0

pred_loss: l2
pred_weight: 1.0
straighten_weight: 0.1
vicreg_std_weight: 0.0
vicreg_cov_weight: 0.0
sigreg_weight: 0.0
chord_weight: 0.0
stop_grad: true

encoder_lr: 1e-5
predictor_lr: 5e-4
weight_decay: 0.0
grad_clip: 0.0

epochs: 50
save_every: 10
batch_size: 32
amp: true
num_workers: 7
