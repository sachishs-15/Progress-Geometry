# cls residual-MLP, window_size=0, HYPERSPHERE norm, NO anti-collapse regularizer.
# The control arm of the three-way hypersphere comparison
# (cls_residual_mlp_hypersphere_window0{,_vicreg,_uniformity}.yaml).
#
# EXPECT THIS ONE TO COLLAPSE, and read it as the floor rather than a candidate. The
# scratch equivalent (sphere projection + non-angular prediction loss + straightening,
# no anti-collapse term) fell to spearman 0.49 within 10 epochs and stayed there. Two
# separate mechanisms push that way: stop_grad alone already collapsed this encoder to
# effective rank 1.1/384 under LayerNorm, and the sphere removes the scale dimension the
# representation could otherwise spread along.
#
# Everything below matches the cls_residual_mlp_paper_window0* family except norm_type,
# pred_loss, and the regularizer line this variant is named for. Its pred_loss=l2 twin
# is cls_residual_mlp_hypersphere_window0*.yaml, so the pair isolates the loss geometry
# with everything else held fixed.
#
# pred_loss: angular = 1 - cos(pred, target), the geometrically matched choice once z is
# on the unit sphere: there the only thing two latents can differ by is their angle, so
# an l2 penalty additionally charges for a radius gap the projection has already removed.
# It is also scale-invariant, which l2 is not (verified in tests/test_model.py).

features: /mnt/rdata7/proprogress/data/kinetics-dataset/precomputed_features/k400_train_10pct.pt
checkpoint_dir: checkpoints/pwm_cls_residual_mlp_hypersphere_angular_window0
val_fraction: 0.0
seed: 0

feature_dim: 384
latent_dim: 384
norm_type: hypersphere
encoder_type: residual_mlp
encoder_depth: 2
encoder_expansion: 4
encoder_dropout: 0.0
token_mode: cls
n_frames: 16
max_len: 16

nhead: 8
pred_num_layers: 2
dropout: 0.1

window_size: 0

pred_loss: angular
pred_weight: 1.0
straighten_weight: 0.1
vicreg_std_weight: 0.0
vicreg_cov_weight: 0.0
sigreg_weight: 0.0
chord_weight: 0.0
stop_grad: true

encoder_lr: 1e-5
predictor_lr: 5e-4
weight_decay: 0.0
grad_clip: 0.0

epochs: 50
save_every: 10
batch_size: 32
amp: true
num_workers: 4