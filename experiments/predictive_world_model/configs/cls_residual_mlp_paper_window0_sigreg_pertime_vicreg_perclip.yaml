# Mixed axes: SIGReg ACROSS clips per timestep (LeWM) + VICReg std/cov WITHIN each clip
# over its 16 frames. Within-clip cov over 16 samples of 384 dims is rank-deficient (cov
# off-diagonals can't all reach 0), so expect a noise floor on vicreg_cov; treat this as
# an exploratory variant. Diff against cls_residual_mlp_paper_window0_sigreg.yaml:
# checkpoint_dir, sigreg_axis, vicreg_*_weight (copied from the vicreg config), vicreg_axis.

features: /mnt/rdata7/proprogress/data/kinetics-dataset/precomputed_features/k400_train_10pct.pt
checkpoint_dir: checkpoints/pwm_cls_residual_mlp_paper_window0_sigreg_pertime_vicreg_perclip
val_fraction: 0.0
seed: 0

feature_dim: 384
latent_dim: 384
norm_type: layernorm
encoder_type: residual_mlp
encoder_depth: 2
encoder_expansion: 4
encoder_dropout: 0.0
token_mode: cls
n_frames: 16
max_len: 16

nhead: 8
pred_num_layers: 2
dropout: 0.1

window_size: 0

pred_loss: l2
pred_weight: 1.0
straighten_weight: 0.1
vicreg_std_weight: 1.0
vicreg_cov_weight: 0.04
vicreg_axis: per_clip
sigreg_weight: 0.1
sigreg_num_slices: 1024
sigreg_axis: per_time
chord_weight: 0.0
stop_grad: true

encoder_lr: 1e-5
predictor_lr: 5e-4
weight_decay: 0.0
grad_clip: 0.0

epochs: 50
save_every: 10
batch_size: 32
amp: true
num_workers: 4