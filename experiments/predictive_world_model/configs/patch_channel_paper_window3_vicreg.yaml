# Ablation on top of patch_channel_paper_window3.yaml (see that file for the full
# reference-mirroring rationale/header) -- SAME paper-mirroring baseline (straighten_weight
# 0.1, stop_grad, encoder_lr/predictor_lr split, etc.), with VICReg additionally turned ON
# as a separate ablation from SIGReg (see patch_channel_paper_window3_sigreg.yaml), per
# conf/train.yaml's own framing: "VICReg is orthogonal to [stop-grad] and CAN be combined"
# -- i.e. an optional add-on to the main recipe, tested here on its own.
#
# std_weight=1.0/cov_weight=0.04 matches the ratio already used in this project's
# cls_mlp_k400 configs (~25:1, the original VICReg paper's own std:cov ratio) -- the
# reference's own README doesn't pin one VICReg weight value, so there's no single
# "reference value" to mirror here the way straighten_weight=0.1 mirrors README's
# aggcos1e-1; this is this project's own validated choice.
#
# vicreg_granularity: token -- matches the reference's actual VICReg exactly (raw
# (B,T,P,D) per-patch tokens flattened directly, see VWorldModel.vcreg_std_loss's use of
# visual_prop(z) with NO aggregation step), NOT "agg" (this project's own default, and
# what earlier vicreg checkpoints here predate -- vicreg_granularity didn't exist yet
# when checkpoints/pwm_patch_channel_k400_10pct_vicreg was run, so that one was
# implicitly "agg"; this run is the first to actually match the reference's granularity).
#
# batch_size: 32 -- kept at the paper-mirror baseline's value (conf/train.yaml
# training.batch_size=32) by explicit request, NOT the batch_size=4 that
# checkpoints/pwm_patch_channel_k400_10pct_vicreg/config.yaml (same window_size=3,
# std=1.0/cov=0.04, straighten=0.1) actually used. If this OOMs, that prior run is the
# known-working fallback value for this combination.

features: /mnt/rdata7/proprogress/data/kinetics-dataset/precomputed_features/dinov2_noreg/k400_train_10pct.pt
checkpoint_dir: checkpoints/pwm_patch_channel_paper_window3_vicreg
val_fraction: 0.0
seed: 0

feature_dim: 384
latent_dim: 384        # unused by projector_type=channel -- actual dim is channel_out_dim
channel_out_dim: 8
channel_hidden: 192
num_patches: 196
token_mode: patch
projector_type: channel
patch_hub_id: dinov2_vits14
patch_img_size: 196    # reference derivation (visual_world_model.py __init__): decoder_scale=16,
                       # num_side_patches = image_size(224)//16 = 14, encoder_image_size =
                       # 14 * patch_size(14) = 196 -- i.e. it resizes to 196px specifically
                       # to force a 14x14 grid, independent of the env's raw 224px images
n_frames: 16

depth: 6
heads: 16
dim_head: 64
mlp_dim: 2048
dropout: 0.1
emb_dropout: 0.0

agg_mlp_hidden_dim: 512
agg_out_dim: 128

window_size: 3          # unchanged from the paper-mirror baseline -- the variable under
                        # test here is the added regularizer, not window_size

pred_loss: l2
pred_weight: 1.0
straighten_weight: 0.1
vicreg_std_weight: 1.0
vicreg_cov_weight: 0.04
vicreg_granularity: token
sigreg_weight: 0.0
chord_weight: 0.0
stop_grad: true

encoder_lr: 1e-5
predictor_lr: 5e-4
weight_decay: 0.0
grad_clip: 0.0

epochs: 50
save_every: 10
batch_size: 32
amp: true
num_workers: 4
