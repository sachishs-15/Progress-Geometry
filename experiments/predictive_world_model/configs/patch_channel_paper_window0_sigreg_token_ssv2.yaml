# Companion to patch_channel_paper_window0_sigreg.yaml, with sigreg_granularity: token
# added -- that flag didn't exist when window0_sigreg.yaml was written, so despite
# setting vicreg_granularity: token there, SIGReg was always regularizing z_agg
# regardless (see losses/world_model_loss.py's forward(): SIGReg had no granularity
# knob of its own until now). This config is the first run where SIGReg is actually
# applied to the raw per-patch z, mirroring what vicreg_granularity=token already did
# for the VICReg terms. NOTE: SIGReg's loss magnitude is not simply proportional to
# sample count (it's an Epps-Pulley-style test statistic, not a raw sum/mean) -- expect
# the loss to run at a different scale than window0_sigreg's (agg-granularity) run, and
# watch train_sigreg early on; sigreg_weight may need retuning down from 0.1 if it
# dominates train_total the way train_sigreg did in some early K400 10% runs.
#
# Companion: patch_channel_paper_window3_sigreg_token.yaml (window_size=3 instead of 0).
#
# SSv2 variant: identical to patch_channel_paper_window0_sigreg_token.yaml except
# `features` (SSv2 train instead of K400 10pct) and checkpoint_dir. See
# patch_channel_paper_window0_ssv2.yaml's header for the merge-shards backstory.
#
# sigreg_granularity: token (below) means SIGReg regularizes the RAW per-patch encoder
# output z directly (every (batch,frame,patch) triple its own sample, N=batch*16*196),
# not the agg_head's z_reg -- this is what OOM'd repeatedly on K400 at batch_size=32
# (traced all the way through: first in sigreg_loss's own (N,num_slices,n_points)
# tensor, then -- after that was fixed by cutting N -- inside BlockCausalPredictor's
# attention itself, since window_size=0 attends over the full 3136-token clip
# regardless of sigreg_granularity). batch_size=16 is the confirmed-working fix; pass
# it via EXTRA_ARGS at submission, matching how the K400 token run was actually
# launched -- this file's own batch_size: 32 is left matching its K400 twin on purpose
# (minimal diff), not because 32 works.

features: /mnt/rdata7/proprogress/data/SSv2/precomputed_features/dinov2_noreg/ssv2_train.pt
checkpoint_dir: checkpoints/pwm_patch_channel_paper_window0_sigreg_token_ssv2
val_fraction: 0.0
seed: 0

feature_dim: 384
latent_dim: 384        # unused by projector_type=channel -- actual dim is channel_out_dim
channel_out_dim: 8
channel_hidden: 192
num_patches: 196
token_mode: patch
projector_type: channel
patch_hub_id: dinov2_vits14
patch_img_size: 196    # reference derivation (visual_world_model.py __init__): decoder_scale=16,
                       # num_side_patches = image_size(224)//16 = 14, encoder_image_size =
                       # 14 * patch_size(14) = 196 -- i.e. it resizes to 196px specifically
                       # to force a 14x14 grid, independent of the env's raw 224px images
n_frames: 16

depth: 6
heads: 16
dim_head: 64
mlp_dim: 2048
dropout: 0.1
emb_dropout: 0.0

agg_mlp_hidden_dim: 512
agg_out_dim: 128

window_size: 0

pred_loss: l2
pred_weight: 1.0
straighten_weight: 0.1
vicreg_std_weight: 0.0
vicreg_cov_weight: 0.0
vicreg_granularity: token
sigreg_weight: 0.1
sigreg_num_slices: 1024
sigreg_granularity: token
chord_weight: 0.0
stop_grad: true

encoder_lr: 1e-5
predictor_lr: 5e-4
weight_decay: 0.0
grad_clip: 0.0

epochs: 50
save_every: 10
batch_size: 32
amp: true
num_workers: 4
