# Rank-N-Contrast (NeurIPS 2023, arXiv:2210.01189) with progress as the continuous
# label: feature similarity must respect the ranking of label distances.
#
# The most on-target objective here -- the paper PROVES its optimum orders features by
# the continuous label, which is verbatim what time_progress_spearman measures. If
# anything should win by construction it is this, and a result where it does not is the
# most informative row in the table.
#
# temperature=2.0 and normalize=false are BOTH the paper's own settings, and they only
# work together. The reference normalizes features solely in its cosine branch and feeds
# raw distances to l2; normalizing them while keeping tau=2 flattens the softmax to
# uselessness (measured with this encoder: 0.74 nats of logit spread over 2048
# candidates, loss 6.79 against a uniform ceiling of 7.63, summed encoder gradient 4.8 --
# versus 16.1 nats, 8.18 and 932 unnormalized). If you switch normalize on, drop tau to
# ~0.1 to recover a comparable spread.
#
# Note the paper's tau=2 is calibrated to ITS feature scale, not ours -- ours comes from
# clip_rmsnorm, where ||z||~19.5 puts raw distances up to 32. sweeps/ brackets tau at
# 0.5 and 8 for that reason, and the gradient norms in train_log.csv are what to check.
#
# sim l2/l1/cosine and project true/false are the two structural variants worth checking:
# `project: true` moves the loss off the measured space, which is the standard
# contrastive recipe and exactly what this project normally does not want.
objective: rank_n_contrast
objective_kwargs:
  temperature: 2.0
  sim: l2
  normalize: false   # the paper's setting; see above -- do not flip without changing tau
  project: false
checkpoint_dir: checkpoints/rank_n_contrast_t2

# ---- Data: SSv2, DINOv2 ViT-S/14 CLS features, 16 frames evenly spread per video ----
features: /mnt/rdata7/proprogress/data/SSv2/precomputed_features/dinov2/ssv2_train.pt
val_features: /mnt/rdata7/proprogress/data/SSv2/precomputed_features/dinov2/ssv2_validation.pt
train_manifest: /home/sachish/proc-planning/data/chirality_in_action/SSv2/ssv2_train.csv
val_manifest: /home/sachish/proc-planning/data/chirality_in_action/SSv2/ssv2_validation.csv

# ---- Held IDENTICAL across every objective in this project. Changing any of these in
# ---- one config and not the others invalidates the comparison -- that is the whole
# ---- point of the folder (see README.md).
feature_dim: 384
latent_dim: 384
hidden_dim: 384
use_projector: true
norm_type: clip_rmsnorm   # one RMS scale per clip: the only norm option that cannot
                          # distort within-clip straightness, which several objectives
                          # here would otherwise be measured through. See
                          # ../predictive_world_model/models/norms.py.
n_frames: 16
epochs: 100
batch_size: 128
lr: 0.0001
head_lr: 0.0005           # the objective's head starts from scratch; the encoder starts
                          # from frozen DINOv2 and only needs a correction.
weight_decay: 0.00001
grad_clip: 1.0
num_workers: 4
seed: 0

# ---- Checkpoint selection: on held-out ordinality, not on the loss (not comparable
# ---- across objectives). Same clip_progress_metrics the final table uses.
eval_every: 5
eval_clips: 512
monitor_source: train     # NOT val: make_eval_spec.py scores the final table on
                          # ssv2_validation, so selecting best.ckpt there would pick every
                          # row by peeking at its own reported metric.
monitor_metric: time_progress_spearman
monitor_mode: max
